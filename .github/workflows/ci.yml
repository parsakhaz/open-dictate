name: CI

on:
  push:
    branches: ['**']
    tags: ['dictate-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only when this workflow is run on a matching dictate-vX.Y.Z tag already on the default branch'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dictate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        name: Fail closed unless publishing a matching version tag
        env:
          DICTATE_PUBLISH: ${{ inputs.publish || false }}
        run: node scripts/release.mjs plan >> "$GITHUB_OUTPUT"

  native:
    name: ${{ matrix.label }} checks, installers and startup
    needs: prepare
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
            platform: win
            arch: x64
          - label: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
          - label: macOS Intel
            os: macos-15-intel
            platform: mac
            arch: x64
          - label: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
          - label: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DICTATE_MODELS_DIR: ${{ github.workspace }}/dictate-model-cache
      DICTATE_CLEANUP_DIR: ${{ github.workspace }}/dictate-cleanup-cache
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Linux desktop runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox xdotool build-essential pkg-config libx11-dev libxtst-dev libxrandr-dev libxt-dev libgtk-3-0t64 libnotify4 libnss3 libxss1 libxtst6 libx11-6 libasound2t64 libxkbcommon0 libgbm1 libatspi2.0-0t64 x11-utils
      - run: pnpm install --frozen-lockfile
      - name: Verify native binary architecture and repair upstream ARM prebuild when required
        run: node qa/prepare-native.mjs --report tmp/package-smoke/native-build.json
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit and platform integration tests
        run: pnpm test
        env:
          DICTATE_CLIPBOARD_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}
      - run: pnpm test:scripts
      - name: Read production speech model digest for the CI cache
        id: speech
        run: node scripts/setup-test-model.mjs --key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ env.DICTATE_MODELS_DIR }}
          key: dictate-speech-${{ runner.os }}-${{ matrix.arch }}-${{ steps.speech.outputs.sha256 }}
      - name: Install pinned speech model through the production setup code
        run: node scripts/setup-test-model.mjs
      - name: Transcribe real speech on this native OS and architecture
        run: |
          mkdir -p tmp/package-smoke
          pnpm exec vitest run test/stt.integration.test.ts test/agc.integration.test.ts --silent=false --reporter=verbose 2>&1 | tee tmp/package-smoke/stt-integration.log
      - name: Read the production cleanup manifest and installer digest for its separate cache
        id: cleanup
        run: node scripts/cleanup-smoke.mjs --key >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ env.DICTATE_CLEANUP_DIR }}
          key: dictate-cleanup-${{ runner.os }}-${{ matrix.arch }}-${{ steps.cleanup.outputs.sha256 }}
      - name: Install pinned cleanup assets and prove native health, completion and process teardown
        run: node scripts/cleanup-smoke.mjs --report tmp/package-smoke/cleanup.json
      - name: Verify native clipboard, focus, typing and physical-key hook (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a bash -e -c '
            openbox --sm-disable > /tmp/dictate-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            sleep 1
            node qa/native-smoke.mjs --report tmp/package-smoke/native-input.json
          '
      - name: Verify native clipboard, focus, typing and physical-key hook (Windows)
        if: runner.os == 'Windows'
        run: node qa/native-smoke.mjs --report tmp/package-smoke/native-input.json
      - name: Verify native frameworks and input permissions (macOS)
        if: runner.os == 'macOS'
        # TCC cannot be granted on hosted Macs. The report retains BLOCKED, never a fake input pass.
        run: node qa/native-smoke.mjs --report tmp/package-smoke/native-input.json --allow-permission-block
      - name: Build native installers without publishing
        run: pnpm package --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Click an agent card's choice with the real pointer (Windows)
        if: runner.os == 'Windows'
        # The pill window is click-through except over a card; only real OS input proves a click reaches it (#9).
        run: |
          node qa/cards-pointer.js || failed=1
          mkdir -p tmp/package-smoke/cards-pointer
          cp tmp/cards-pointer/report.json tmp/cards-pointer/*.png tmp/package-smoke/cards-pointer/ 2>/dev/null || true
          exit ${failed:-0}
      - name: Verify WAV capture through the real app, recognizer, output and cancellation (Linux)
        if: runner.os == 'Linux'
        env:
          DICTATE_SMOKE_NO_SANDBOX: '1'
        run: |
          xvfb-run -a bash -e -c '
            openbox --sm-disable > /tmp/dictate-app-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            sleep 1
            node qa/app-smoke.mjs --report tmp/package-smoke/app-flow.json
            node qa/settings-progress.mjs --report tmp/package-smoke/settings-progress.json
          '
      - name: Verify WAV capture through the real app, recognizer, output and cancellation (Windows/macOS)
        if: runner.os != 'Linux'
        run: |
          node qa/app-smoke.mjs --report tmp/package-smoke/app-flow.json
          node qa/settings-progress.mjs --report tmp/package-smoke/settings-progress.json
      - name: Checksum testing downloads
        run: node scripts/release.mjs stage dist
      - name: Launch packaged app and installed artifacts (Linux virtual desktop)
        if: runner.os == 'Linux'
        # Hosted runner AppArmor blocks Chromium user namespaces. This flag is test-only.
        env:
          DICTATE_SMOKE_NO_SANDBOX: '1'
        run: xvfb-run -a pnpm smoke:package --installers
      - name: Launch packaged app and installed artifacts (Windows/macOS)
        if: runner.os != 'Linux'
        run: pnpm smoke:package --installers
      - name: Install the .deb and verify native startup with the Chromium process sandbox enabled
        if: runner.os == 'Linux'
        # electron-builder's postinst installs the package's Ubuntu AppArmor profile. This actual
        # system installation is separate from portable/extracted probes that require a CI exception.
        run: xvfb-run -a node scripts/smoke-package.mjs --system-deb
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dictate-evidence-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: tmp/package-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload testing installers
        uses: actions/upload-artifact@v4
        with:
          name: dictate-package-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
            dist/SHA256SUMS
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish validated Dictate version
    needs: [prepare, native]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify version and default-branch ancestry
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/release.mjs validate "$RELEASE_TAG"
          git fetch origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - uses: actions/download-artifact@v4
        with:
          pattern: dictate-package-*-*-${{ github.sha }}
          path: artifacts
      - name: Require every platform and create aggregate checksums
        run: node scripts/release.mjs collect artifacts release
      - name: Create release after all native checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Dictate ${RELEASE_TAG#dictate-v}" --notes-file .github/release-notes.md
